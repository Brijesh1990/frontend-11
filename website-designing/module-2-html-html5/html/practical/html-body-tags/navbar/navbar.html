<!DOCTYPE html>
<html>
<head>
<meta charset='utf-8'>
<meta http-equiv='X-UA-Compatible' content='IE=edge'>
<title>navbar app</title>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<link rel='stylesheet' type='text/css' media='screen' href='main.css'>
<script src='main.js'></script>
<style>
body 
{
margin: 0;
padding: 0;    
}    
#navbar-app
{
width: 100%;
height: auto;
background-color: black;
top: 0;
position: sticky;    
}
#navbar-app ul 
{
margin-top: 0;    
}
#navbar-app ul li 
{
display: inline-block;
padding: 30px 25px;    
}
#navbar-app a 
{
color: white;
font-size: 20px;
text-decoration: none;
list-style-type: none;    
}
#content-app
{
width: 50%;
height: auto;
margin: auto;
margin-top: 5%;    
}
.box 
{
width: 80%;
height: auto;
margin: auto;
padding: 65px;
background-color: black;
color: white;    
border-radius: 10px;
margin-top: 5%;
}
</style>
</head>
<body>
<!-- navbar start here -->
<section id="navbar-app">
<ul>
<li><a href="#">🏠 Home</a></li>
<li><a href="#">About</a></li>
<li><a href="#">🕖 Services</a></li>
<li><a href="#">Feedback</a></li>
<li><a href="#">📞 contact us</a></li>    
</ul>
</section> 
<!--content start here  -->
<section id="content-app">
  <div class="box"></div>
  <div class="box"></div>
  <div class="box"></div>
  <div class="box"></div>
  <div class="box"></div>
</section>
</body>
</html>
